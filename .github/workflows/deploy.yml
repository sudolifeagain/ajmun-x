name: Deploy

# Called by trusted main-push CI only, after all validation jobs succeed.

on:
  workflow_call:

concurrency:
  group: production-deploy
  cancel-in-progress: false  # デプロイ中の別デプロイによるコンテナ停止を防止

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify trusted revision before accessing deployment secrets
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"

      - name: Validate inputs
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
        run: |
          if [[ ! "$APP_DIR" =~ ^/[a-zA-Z0-9/_.-]+$ || "$APP_DIR" == / ]]; then
            echo "::error::Invalid APP_DIR format: must be an absolute path with safe characters"
            exit 1
          fi
          if [[ ! "$SERVICE_NAME" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Invalid SERVICE_NAME format: must contain only alphanumeric, underscore, dot, hyphen"
            exit 1
          fi
          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]] || (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo "::error::Invalid SSH_PORT format: must be numeric"
            exit 1
          fi

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync files
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${APP_DIR}/build' '${APP_DIR}/data' && chmod 750 '${APP_DIR}/data'"
          git archive --format=tar HEAD | ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "tar xf - -C '${APP_DIR}/build/'"

      - name: Build candidate image
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "cd '${APP_DIR}/build' && \
            DOCKER_BUILDKIT=1 docker build --pull -t '${SERVICE_NAME}:candidate' ."

      - name: Activate candidate image
        id: deploy
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "\
            OLD_IMAGE=\$(docker inspect -f '{{.Image}}' '${SERVICE_NAME}' 2>/dev/null || true); \
            if [ -n \"\$OLD_IMAGE\" ]; then docker tag \"\$OLD_IMAGE\" '${SERVICE_NAME}:prev' || exit 1; fi; \
            docker tag '${SERVICE_NAME}:candidate' '${SERVICE_NAME}' && \
            (docker stop '${SERVICE_NAME}' 2>/dev/null || true) && \
            (docker rm '${SERVICE_NAME}' 2>/dev/null || true) && \
            bash '${APP_DIR}/build/deploy/run-container.sh' '${APP_DIR}' '${SERVICE_NAME}' '${SERVICE_NAME}'"

      - name: Deploy nginx config
        id: nginx
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
        run: |
          # Install the repo-managed nginx config (deploy/nginx/ajmun.conf) and
          # reload nginx. The deploy user has no passwordless sudo for nginx but
          # is in the docker group, so we enter the host namespaces (nsenter -t 1)
          # through a privileged container to run the installer as host root.
          # The installer validates with `nginx -t` and rolls back on failure.
          SCRIPT="${APP_DIR}/build/deploy/nginx/install-nginx-config.sh"
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" \
            "docker run --rm --privileged --pid=host alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
               nsenter -t 1 -m -u -i -n -p -- sh '${SCRIPT}'"

      - name: Health check
        id: health
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          # コンテナの Running 状態確認
          STATUS=$(ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "docker inspect -f '{{.State.Running}}' '${SERVICE_NAME}'")
          if [ "$STATUS" != "true" ]; then
            echo "::error::Container is not running"
            ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "docker logs '${SERVICE_NAME}' --tail 50"
            exit 1
          fi

          # HTTP 応答チェック（5回リトライ、計30秒）
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || echo '000'")
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "Health check passed (HTTP ${HTTP_CODE})"
              exit 0
            fi
            echo "Attempt ${i}/5: HTTP ${HTTP_CODE}, retrying in 6s..."
            sleep 6
          done
          echo "::error::Health check failed after 5 attempts"
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "docker logs '${SERVICE_NAME}' --tail 50"
          exit 1

      - name: Cleanup old images
        if: success()
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
        run: |
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "docker image prune -f" || true

      - name: Rollback on failure
        if: failure() && (steps.deploy.outcome == 'failure' || steps.nginx.outcome == 'failure' || steps.health.outcome == 'failure')
        env:
          SSH_HOST: ${{ secrets.OCI_SSH_HOST }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          SSH_PORT: ${{ secrets.OCI_SSH_PORT }}
          APP_DIR: ${{ vars.APP_DIR }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
        run: |
          echo "::warning::Attempting rollback to previous image..."
          ssh -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "\
            if docker image inspect '${SERVICE_NAME}:prev' >/dev/null 2>&1; then \
              (docker stop '${SERVICE_NAME}' 2>/dev/null || true) && \
              (docker rm '${SERVICE_NAME}' 2>/dev/null || true) && \
              bash '${APP_DIR}/build/deploy/run-container.sh' '${APP_DIR}' '${SERVICE_NAME}' '${SERVICE_NAME}:prev' && \
              echo 'Rollback succeeded' || echo '::error::Rollback failed'; \
            else \
              echo '::error::No previous image available for rollback'; \
            fi"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then
            MSG="**Deploy succeeded** on \`main\` (${GITHUB_SHA::7})"
          else
            MSG="**Deploy failed** on \`main\` (${GITHUB_SHA::7})\nRun: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"${MSG}\"}"
